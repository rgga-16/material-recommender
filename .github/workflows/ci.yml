name: CI

on:
  push:
    branches: [main, overhaul]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The API layer imports torch/diffusers lazily, so the tests only need
      # the light dependencies — no multi-GB ML stack in CI.
      - name: Install test dependencies
        run: pip install flask waitress pillow numpy imageio onnxruntime requests pytest
      - name: Run backend tests
        run: pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
